include:
  - path: docker-compose.api.${BUILD_TARGET:-development}.yml
  - path: docker-compose.react.${BUILD_TARGET:-development}.yml

services:
  task_db:
    image: postgres:16-alpine
    container_name: task_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - task_volume:/var/lib/postgresql/data
      - ./data:/docker-entrypoint-initdb.d
    networks:
      - task_net

volumes:
  task_volume:

networks:
  task_net:
    driver: bridge
