services:
  task_api:
    build:
      context: ./api
      target: development
    container_name: task_api
    ports:
      - "${API_PORT}:3000"
    env_file:
      - .env
    environment:
      DB_HOST: task_db
      DB_PORT: ${DB_PORT}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@task_db:5432/${DB_NAME}
    volumes:
      - ./api:/opt
      - /opt/node_modules
    depends_on:
      task_db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - task_net