services:
  task_api:
    build:
      context: ./api
      target: production
    container_name: task_api
    env_file: ".env"
    ports:
      - "${API_PORT}:3000"
    env_file:
      - .env
    environment:
      DB_HOST: task_db
      DB_PORT: ${DB_PORT}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@task_db:5432/${DB_NAME}
    depends_on:
      task_db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - task_net
  
  task_react:
    build:
      context: ./react
      target: production
    container_name: task_react
    ports:
      - "${REACT_PORT}:80"
    restart: unless-stopped
    depends_on:
      task_api:
        condition: service_started
    networks:
      - task_net